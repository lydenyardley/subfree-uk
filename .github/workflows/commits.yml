name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit; `v4` in the comment is the tag this was.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The whole history, so the range below has both ends to walk. A
          # shallow clone leaves the base commit missing and the check passes
          # a range it never saw.
          fetch-depth: 0
      - name: Check every commit this change brings
        env:
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PULL_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          # Messages written before this check existed are not re-litigated.
          # The first push of a branch that predates it would otherwise turn
          # red on history the rule never saw, and a permanently red run
          # teaches people to ignore the run. The commit that last touched
          # this workflow is the floor; a newer base wins over it.
          floor=$(git log -1 --format=%H -- .github/workflows/commits.yml)
          if git merge-base --is-ancestor "$base" "$floor"; then
            base="$floor"
          fi
          python3 build/check_commits.py "$base..HEAD"
