name: Prices

# The due list says when the data needs a person. A browser probe then reads
# every recorded price and offer and reports changes without editing the data.
# The citations are swept last, so a dead link cannot stop the report from being
# filed.
on:
  schedule:
    # Monday morning, so the week starts with the work it has to do.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    name: Check the price list and citations
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, with the tag they were on in the comment,
      # as in the audit: a moved tag must not change what this run did.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}
      - name: Install the price watch dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements.txt
          python -m playwright install --with-deps chromium firefox
      # The due list needs the dataset; the feed report needs the two public
      # product feeds. Neither needs a browser.
      - name: Write the list
        id: due
        run: |
          set +e
          python build/refresh.py > refresh.md
          echo "due=$?" >> "$GITHUB_OUTPUT"
          cat refresh.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check the brand feeds
        run: |
          set +e
          python build/lineup_feed.py > feed.md
          cat feed.md >> refresh.md
          cat feed.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read the recorded prices
        id: prices
        run: |
          set +e
          # Headed Chromium under xvfb passes retailer 403 walls that reject
          # the automated Chromium build.
          xvfb-run -a python build/price_watch.py --headed > price-watch.md
          code=$?
          cat price-watch.md
          cat price-watch.md >> refresh.md
          cat price-watch.md >> "$GITHUB_STEP_SUMMARY"
          changed=$(grep -o 'price-watch changed=[0-9]*' price-watch.md | head -1 | cut -d= -f2)
          echo "changed=${changed:-0}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # One open issue is the standing reminder; each week adds to it rather than
      # opening a second. Closing it is how the work is declared done.
      - name: File it, or add to the open one
        if: steps.due.outputs.due == '1' || steps.prices.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search 'Weekly price check in:title' \
                --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file refresh.md
          else
            gh issue create --title "Weekly price check" --body-file refresh.md
          fi
      # The sweep reads the category pages and follows every citation. It runs
      # after the issue so a dead link cannot stop the due list from being filed.
      # A bot wall is reported and passes; a dead page or server error fails.
      - name: Sweep external citations
        run: |
          set +e
          python build/links.py > links.md
          code=$?
          cat links.md
          cat links.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # A crash in the probe, rather than a changed or unreadable price, is the
      # one condition that must fail after the issue has been filed.
      - name: Fail if the price watch crashed
        if: steps.prices.outputs.code != '0'
        run: exit 1
