name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}
      - name: Install the audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild, then audit
        run: python build/check.py
