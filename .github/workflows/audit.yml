name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, with the tag they were on in the
      # comment: a moved tag must not change what this run did.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}
      - name: Install the audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements.txt
          python -m playwright install --with-deps chromium firefox
      - name: Rebuild, then audit
        run: python build/check.py
